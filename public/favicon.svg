<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="comparTICKET">
  <!--
    Favicon — versión para 16-32 px (pestaña del navegador, marcadores).

    Misma silueta que icon.svg —impresora arriba, papel saliendo con el borde
    dentado— pero sin texto ni piloto: a 16 px se convierten en suciedad.

    Se conservan solo tres renglones, más gruesos y separados, y el importe en
    naranja. Ese punto de color es lo que hace que la pestaña se localice de un
    vistazo entre veinte.
  -->

  <rect width="512" height="512" rx="96" fill="#ECEAE4"/>

  <!-- Impresora -->
  <rect x="46" y="66" width="420" height="116" rx="30" fill="#18181B"/>
  <!-- Ranura -->
  <rect x="78" y="166" width="356" height="12" rx="6" fill="#000" opacity="0.5"/>

  <!-- Papel saliendo -->
  <path fill="#FEFEF8" d="
    M 104 176
    h 304
    v 240
    l -38 32 -38 -32 -38 32 -38 -32 -38 32 -38 -32 -38 32 -38 -32
    z"/>

  <!-- Renglones: pocos y gruesos, los justos para que se lea como un ticket -->
  <g fill="#C7C7CC">
    <rect x="142" y="232" width="134" height="28" rx="14"/>
    <rect x="142" y="298" width="104" height="28" rx="14"/>
  </g>
  <rect x="142" y="364" width="134" height="28" rx="14" fill="#FF6B35"/>
</svg>
