<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ECEAE4">
  <title>comparTICKET — Divide la cuenta en segundos</title>
  <meta name="description" content="Haz una foto del ticket y que cada uno marque lo que ha tomado. Sin discutir y sin calculadora.">

  <!-- Icono. SVG para navegadores modernos; el de 16-32 px va sin renglones
       porque a ese tamaño se convierten en una mancha gris. -->
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="comparTICKET">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- Vista previa al compartir el enlace. La de la pantalla de reparto se
       genera al vuelo en el servidor con el nombre del sitio y el importe. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="comparTICKET">
  <meta property="og:title" content="comparTICKET — Divide la cuenta en segundos">
  <meta property="og:description" content="Haz una foto del ticket y que cada uno marque lo que ha tomado. Sin discutir y sin calculadora.">
  <meta property="og:image" content="/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fuentes con preconexión. Antes se cargaban con @import dentro del CSS,
       que es el método más lento: el navegador tenía que descargar y leer la
       hoja de estilos antes de descubrir siquiera que hacían falta. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&family=Space+Mono:wght@400;700&family=Bricolage+Grotesque:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">

    <!-- Top bar -->
    <div class="top-bar">
      <div style="width:36px;"></div>
      <div class="top-bar-title" style="font-size:0.88rem;font-weight:800;letter-spacing:0.02em;">
        <span style="font-weight:400;opacity:0.6;">compar</span><span>TICKET</span>
      </div>
      <div style="width:36px;"></div>
    </div>

    <!-- Upload area -->
    <!-- Solo visible al llegar desde un grupo: dice a que grupo va este
         ticket y deja volver sin escanear nada. -->
    <!-- Volver al grupo. Antes era una barra naranja entera que competia con
         los dos botones de escanear, que es a lo que se ha venido. Ahora solo
         la flecha es el boton; el texto de al lado dice a donde vuelves. -->
    <div class="volver-fila hidden" id="volverGrupo">
      <a class="volver-flecha" id="volverGrupoLink" href="/" aria-label="Volver al grupo">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </a>
      <span class="volver-texto">Volver a <strong id="grupoDestinoNombre">tu grupo</strong></span>
    </div>

    <div class="upload-area" id="uploadArea">
      <div class="via-label" id="viaSueltaLabel">DIVIDE UNA CUENTA</div>
      <div class="upload-btns-row">
        <button class="upload-option" id="cameraBtn" type="button">
          <div class="upload-option-icon">
            <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
          </div>
          <span id="cameraBtnText"></span>
        </button>
        <button class="upload-option" id="galleryBtn" type="button">
          <div class="upload-option-icon">
            <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
          </div>
          <span id="galleryBtnText"></span>
        </button>
      </div>
      <div class="upload-title" id="uploadTitle"></div>
      <div class="upload-sub" id="uploadSub"></div>

      <!-- El paso a paso ya no va escrito aqui: lo da el tutorial guiado,
           que solo sale la primera vez (ver tour.js, al final del fichero). -->

      <!-- Segunda via, con el mismo peso visual que la primera: un grupo que
           acumula gastos durante todo un viaje y al final dice quien paga a
           quien. Antes era un enlace pequeno que no se distinguia de un texto
           mas, y nadie lo encontraba. -->
      <hr class="dash-sep via-sep">

      <div class="via-label" id="viaGrupoLabel">O LLEVA LAS CUENTAS DE UN GRUPO</div>

      <button class="group-cta" id="groupCta" type="button">
        <svg class="gc-people" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
        <span id="groupCtaText">Crear un grupo</span>
        <svg class="gc-pig" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><ellipse cx="13" cy="12.6" rx="7.4" ry="5.4"/><path d="M9.4 7.6 11.9 4.9 13.1 8.4Z"/><ellipse cx="5.1" cy="13" rx="2.7" ry="2.3"/><rect x="8.4" y="17.2" width="2.3" height="2.8" rx="1.1"/><rect x="14.6" y="17.2" width="2.3" height="2.8" rx="1.1"/><rect x="11.2" y="8" width="5.2" height="1.5" rx=".75" fill="#FFFEF8"/><circle cx="9.1" cy="11.4" r=".95" fill="#FFFEF8"/></svg>
      </button>

      <div class="group-cta-sub" id="groupCtaSub">Para un viaje o un piso compartido…</div>

      <!-- Los grupos en los que ya has entrado desde ESTE movil.
           Sin cuentas de usuario, un grupo desaparecia al cerrar la pestana:
           o tenias el enlace guardado o lo habias perdido. El enlace sigue
           siendo la llave, pero ya no hay que buscarlo en WhatsApp cada vez.

           Va como segundo boton igual que el de crear, y no como una lista
           colgando debajo: asi cabe en pantalla sin bajar, y la lista solo
           ocupa sitio cuando se pide. -->
      <button class="group-cta group-cta-b hidden" id="verGruposCta" type="button">
        <svg class="gc-people" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/><circle cx="18.5" cy="17" r="2.2"/></svg>
        <span id="verGruposTexto">Ver mis grupos</span>
        <span class="gc-badge" id="verGruposCuantos"></span>
      </button>

      <div class="my-groups hidden" id="misGrupos">
        <div id="misGruposLista"></div>
      </div>

      <!-- Acceso directo en la pantalla del movil.
           En Android el navegador avisa cuando se puede instalar y entonces
           sale el boton. En iPhone no hay forma de provocarlo —Apple no da
           esa API—, asi que alli se ensenan las instrucciones y ya esta.
           Si la aplicacion ya esta instalada, no se ensena nada. -->
      <div class="atajo hidden" id="atajo">
        <button class="atajo-btn" id="atajoBtn" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          <span class="atajo-txt">
            <span class="atajo-tit" id="atajoTitulo"></span>
            <span class="atajo-sub" id="atajoSub"></span>
          </span>
        </button>
      </div>

      <!-- Idioma y moneda. Al final de la pagina a proposito: se toca una vez
           y no se vuelve, asi que no puede quitarle sitio a lo que si se usa
           todos los dias. -->
      <div class="ajustes">
        <label class="ajuste">
          <span class="ajuste-lbl" id="lblIdioma">IDIOMA</span>
          <select id="selIdioma">
            <option value="es">Espa&#241;ol</option>
            <option value="en">English</option>
            <option value="fr">Fran&#231;ais</option>
            <option value="it">Italiano</option>
            <option value="de">Deutsch</option>
            <option value="no">Norsk</option>
            <option value="pl">Polski</option>
          </select>
        </label>
        <label class="ajuste">
          <span class="ajuste-lbl" id="lblMoneda">MONEDA</span>
          <select id="selMoneda">
            <option value="EUR">EUR &#8364;</option>
            <option value="USD">USD $</option>
            <option value="GBP">GBP &#163;</option>
            <option value="DKK">DKK kr</option>
            <option value="NOK">NOK kr</option>
          </select>
        </label>
        <div class="ajuste-nota" id="notaMoneda"></div>
      </div>
    </div>

    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="galleryInput" accept="image/*" multiple style="display:none">

    <!-- Preview overlay: grid of thumbnails + add-more button + scan -->
    <div class="preview-overlay hidden" id="previewOverlay">
      <div class="thumbs" id="previewThumbs"></div>
      <div class="preview-add-hint" id="addHintText"></div>
      <div class="preview-btns">
        <button class="btn btn-retake" id="retakeBtn">
          <span id="retakeText"></span>
        </button>
        <button class="btn btn-blue" id="scanBtn">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
          <span id="scanText"></span>
        </button>
      </div>
    </div>

    <!-- Processing -->
    <div class="processing hidden" id="processing">
      <div class="loader-printer">
        <div class="lp-slot"></div>
        <div class="lp-paper"></div>
      </div>
      <div class="loader-text"><span id="procText"></span><span class="dot-pulse"></span></div>
    </div>

    <div class="home-indicator"></div>
    <div class="easter-egg">desarrollado por A.Sáez.F</div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/tour.js"></script>
  <script src="/js/money.js"></script>
  <script src="/js/imgprep.js"></script>
  <script src="/js/upload.js"></script>
</body>
</html>
