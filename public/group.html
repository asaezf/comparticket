<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ECEAE4">
  <title>Grupo · comparTICKET</title>
  <meta name="description" content="Todos los gastos del grupo en un sitio, y quién le paga a quién al final.">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- Vista previa al compartir. El servidor la rellena con el nombre del
       grupo y lo que lleváis gastado. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="comparTICKET">
  <meta property="og:title" content="Grupo · comparTICKET">
  <meta property="og:description" content="Todos los gastos del grupo en un sitio, y quién le paga a quién al final.">
  <meta property="og:image" content="/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&family=Space+Mono:wght@400;700&family=Bricolage+Grotesque:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="pantalla-grupo">
  <div class="page">

    <div class="top-bar">
      <button class="top-bar-btn" onclick="window.location.href='/'">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="top-bar-title" id="barTitle">Grupo</div>
      <button class="top-bar-btn" id="shareTopBtn" title="Compartir grupo">
        <svg viewBox="0 0 24 24"><path d="M16 5l-1.42 1.42-1.59-1.59V16h-1.98V4.83L9.42 6.42 8 5l4-4 4 4zm4 5v11c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2V10c0-1.11.89-2 2-2h3v2H6v11h12V10h-3V8h3c1.1 0 2 .89 2 2z"/></svg>
      </button>
    </div>

    <div class="printer-assembly">
      <div class="printer-body">
        <div class="printer-brand"><span>compar</span><strong>TICKET</strong></div>
        <div class="printer-right">
          <div class="printer-leds">
            <div class="printer-led on"></div>
            <div class="printer-led idle"></div>
          </div>
        </div>
        <div class="printer-slot-line"></div>
      </div>

      <div class="ticket-wrap">
        <div class="ticket printing" id="ticket">

          <div class="ticket-header">
            <div class="ticket-store" id="groupName">···</div>
            <div class="ticket-date" id="groupDates"></div>
          </div>

          <hr class="dash-sep heavy">

          <!-- Cuánto ha movido el grupo -->
          <div class="data-row">
            <span class="data-label" id="lblTotal">Total del grupo</span>
            <span class="data-value big" id="groupTotal">0,00 €</span>
          </div>
          <div class="data-row">
            <span class="data-label" id="lblCount">Gastos</span>
            <span class="data-value" id="groupCount">0</span>
          </div>

          <hr class="dash-sep">

          <!-- Quién eres, para poder decirte TU saldo. Se recuerda por grupo. -->
          <div class="who-block" id="whoBlock">
            <div class="who-label" id="whoLabel">¿QUIÉN ERES?</div>
            <div class="who-pills" id="whoPills"></div>
          </div>

          <!-- Tu saldo, en grande: es lo primero que quiere ver cualquiera -->
          <div class="my-balance hidden" id="myBalance">
            <div class="mb-label" id="myBalanceLabel"></div>
            <div class="mb-amount" id="myBalanceAmount">0,00 €</div>
            <div class="mb-hint" id="myBalanceHint"></div>
          </div>

          <hr class="dash-sep">

          <!-- Saldo de cada uno -->
          <div class="sec-title">SALDOS</div>
          <div id="balancesList"></div>

          <hr class="dash-sep">

          <!-- El cuadre: quien le paga a quien, con el minimo de pagos -->
          <div class="sec-title">
            <span id="repartoTitulo">REPARTO</span>
          </div>

          <!-- El aviso de lo que queda fuera del cuadre.
               Estaba pegado a la derecha del titulo, en letra diminuta y
               partiendose por la mitad. Aqui abajo tiene sitio para decirse
               entero y en dos alturas: primero la cifra, y debajo por que. -->
          <div class="settle-note hidden" id="settleNote">
            <span class="sn-amount" id="settleNoteAmount"></span>
            <span class="sn-why" id="settleNoteWhy"></span>
          </div>

          <!-- Easter egg: tres toques en REPARTO. Se guarda en el grupo y no
               en el movil para que la vea todo el mundo; si cada uno tuviera
               la suya, el mismo grupo mandaria mensajes distintos. -->
          <div class="tpl-panel hidden" id="tplPanel">
            <div class="tpl-head">Mensaje de recordatorio</div>
            <textarea id="tplText" rows="4" maxlength="400"></textarea>
            <div class="tpl-keys">
              Usa <code>{nombre}</code> <code>{importe}</code> <code>{a}</code> <code>{grupo}</code>
            </div>
            <div class="tpl-preview" id="tplPreview"></div>
            <div class="ef-actions">
              <button class="btn btn-ghost btn-half" id="tplReset">Por defecto</button>
              <button class="btn btn-dark btn-half" id="tplSave">Guardar</button>
            </div>
          </div>
          <div id="transfersList"></div>

          <hr class="dash-sep">

          <!-- GASTOS: las dos formas de meter dinero al grupo, juntas y al
               mismo nivel. Antes estaban en dos apartados distintos y el de
               abajo parecia secundario. -->
          <div class="sec-title">AÑADIR</div>
          <div class="add-row">
            <button class="add-btn" id="addTicketBtn" type="button">
              <span class="ab-icos"><svg class="ab-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/><path d="M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg><svg class="ab-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 2h14a1 1 0 0 1 1 1v18.1a.5.5 0 0 1-.75.43L17.5 20.4l-1.75 1.15a.5.5 0 0 1-.55 0L13.5 20.4l-1.75 1.15a.5.5 0 0 1-.55 0L9.5 20.4l-1.75 1.15a.5.5 0 0 1-.55 0L5.5 20.4l-1.75 1.13A.5.5 0 0 1 3 21.1V3a1 1 0 0 1 1-1z" opacity=".18"/><path d="M5.2 2.4h13.6a.9.9 0 0 1 .9.9v17.4c0 .38-.42.6-.74.4l-1.66-1.05-1.66 1.05a.75.75 0 0 1-.8 0l-1.66-1.05-1.66 1.05a.75.75 0 0 1-.8 0L8.1 20.05 6.44 21.1a.47.47 0 0 1-.74-.4V3.3a.9.9 0 0 1 .9-.9z" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="8" y="7" width="8" height="1.5" rx=".75"/><rect x="8" y="11" width="8" height="1.5" rx=".75"/><rect x="8" y="15" width="5" height="1.5" rx=".75"/></svg></span>
              <span>Escanear un ticket</span>
            </button>
            <button class="add-btn" id="addExpenseBtn" type="button">
              <span class="ab-icos"><svg class="ab-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="1.6" y="4.6" width="20.8" height="14.8" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="1.6" y="8" width="20.8" height="3"/><rect x="4.6" y="14" width="6" height="1.8" rx=".9"/></svg><svg class="ab-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7.4" y="1.6" width="9.2" height="3.2" rx="1" opacity=".45"/><rect x="4.4" y="5" width="15.2" height="17.4" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="7" y="7.6" width="10" height="4.4" rx="1"/><circle cx="8.4" cy="15.4" r="1.05"/><circle cx="12" cy="15.4" r="1.05"/><circle cx="15.6" cy="15.4" r="1.05"/><circle cx="8.4" cy="18.9" r="1.05"/><circle cx="12" cy="18.9" r="1.05"/><circle cx="15.6" cy="18.9" r="1.05"/></svg></span>
              <span>Gasto sin ticket</span>
            </button>
          </div>

          <!-- Formulario de gasto suelto, plegado hasta que hace falta -->
          <div class="expense-form hidden" id="expenseForm">
            <div class="ef-row">
              <input type="text" id="expDesc" placeholder="Nombre del gasto" maxlength="60">
              <input type="number" id="expAmount" placeholder="0,00" step="0.01" min="0.01" inputmode="decimal">
            </div>
            <div class="ef-label">¿QUIÉN LO PAGÓ?</div>
            <div class="ef-pills" id="expPaidBy"></div>
            <div class="ef-label">¿ENTRE QUIÉNES SE REPARTE?</div>
            <div class="ef-pills" id="expSplit"></div>
            <div class="ef-actions">
              <button class="btn btn-ghost btn-half" id="expCancel">Cancelar</button>
              <button class="btn btn-dark btn-half" id="expSave">Guardar gasto</button>
            </div>
          </div>

          <!-- Cada seccion se toca y se abre. No lleva flecha ni texto:
               una fila con un total y un recuento delante es algo que se
               toca, y el unico aviso que hace falta es que se hunda al
               pulsarla.

               El titulo va en dos alturas, como se imprime en un ticket:
               arriba el nombre y el dinero, debajo la aclaracion y el
               recuento. Antes era una sola linea con cuatro cosas
               apretadas que se cortaban entre si. -->
          <button class="sec-head" id="foldExpenses" type="button">
            <span class="sh-line">
              <span class="sh-title">OTROS GASTOS</span>
              <span class="sh-sum" id="totalExpenses"></span>
            </span>
            <span class="sh-line sh-line-b">
              <span class="sh-what">sin ticket</span>
              <span class="sh-count" id="totalExpensesCount"></span>
            </span>
          </button>
          <div class="sec-body" id="expensesList"></div>

          <hr class="dash-sep">

          <button class="sec-head" id="foldOpen" type="button">
            <span class="sh-line">
              <span class="sh-title">TICKETS ABIERTOS</span>
              <span class="sh-sum" id="totalOpen"></span>
            </span>
            <span class="sh-line sh-line-b">
              <span class="sh-what">todavía fuera del reparto</span>
              <span class="sh-count" id="totalOpenCount"></span>
            </span>
          </button>
          <div class="sec-body" id="openList"></div>

          <hr class="dash-sep">

          <button class="sec-head" id="foldClosed" type="button">
            <span class="sh-line">
              <span class="sh-title">HISTORIAL DE TICKETS</span>
              <span class="sh-sum" id="totalClosed"></span>
            </span>
            <span class="sh-line sh-line-b">
              <span class="sh-what">cerrados</span>
              <span class="sh-count" id="totalClosedCount"></span>
            </span>
          </button>
          <div class="sec-body" id="closedList"></div>

          <hr class="dash-sep">

          <button class="sec-head" id="foldStats" type="button">
            <span class="sh-line">
              <span class="sh-title">RESUMEN</span>
              <span class="sh-sum" id="totalStats"></span>
            </span>
            <span class="sh-line sh-line-b">
              <span class="sh-what">del grupo</span>
              <span class="sh-count" id="totalStatsCount"></span>
            </span>
          </button>
          <div class="sec-body" id="statsBlock"></div>

          <hr class="dash-sep">

          <div class="soon-inline" id="fotosProximamente">
            📷 Pronto podrás ver aquí la foto original de cada ticket
          </div>

        </div>
        <div class="ticket-zigzag"></div>
      </div>
    </div>

    <div class="bottom-sticky" id="bottomArea">
      <button class="btn btn-dark btn-full" id="shareGroupBtn">Compartir grupo</button>
    </div>

    <div class="home-indicator"></div>
    <div class="easter-egg">desarrollado por A.Sáez.F</div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/money.js"></script>
  <script src="/js/settle.js"></script>
  <script src="/js/group.js"></script>
</body>
</html>
