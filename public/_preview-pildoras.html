<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Píldoras — antes y después</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  body{background:#F4F4F5;padding:16px;font-family:system-ui,sans-serif}
  .caja{background:#FEFEF8;border-radius:12px;padding:16px;margin-bottom:14px;max-width:420px}
  h3{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#71717A;margin:0 0 12px}
  .viejo .unit-pill{min-height:0}
  .num{font-weight:800;font-size:.78rem}
</style></head><body>

<div class="caja viejo">
  <h3>❌ Antes — se lee como cantidad</h3>
  <div class="claim-row-v2">
    <div class="ci-head"><div class="ci-name">Cervezas</div><div class="ci-price">2,50 €/ud</div></div>
    <div class="ci-units">
      <button class="unit-pill"><span class="num">1</span><span class="up-body"></span></button>
      <button class="unit-pill"><span class="num">2</span><span class="up-body"></span></button>
      <button class="unit-pill"><span class="num">3</span><span class="up-body"></span></button>
      <button class="unit-pill"><span class="num">4</span><span class="up-body"></span></button>
      <button class="unit-pill"><span class="num">5</span><span class="up-body"></span></button>
      <button class="unit-pill"><span class="num">6</span><span class="up-body"></span></button>
    </div>
  </div>
</div>

<div class="caja">
  <h3>✅ Ahora — seis casillas iguales</h3>
  <div class="claim-row-v2">
    <div class="ci-head"><div class="ci-name">Cervezas</div><div class="ci-mine on">tú: 3 · 7,50 €</div><div class="ci-price">2,50 €/ud</div></div>
    <div class="ci-units" id="demo">
      <button class="unit-pill mine"><span class="up-body"><svg class="up-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></span></button>
      <button class="unit-pill mine"><span class="up-body"><svg class="up-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg></span></button>
      <button class="unit-pill shared"><span class="up-body"><span class="up-claim">tú</span><span class="up-claim">ana</span></span></button>
      <button class="unit-pill theirs"><span class="up-body"><span class="up-claim">luis</span></span></button>
      <button class="unit-pill"><span class="up-body"></span></button>
      <button class="unit-pill"><span class="up-body"></span></button>
    </div>
    <div class="ci-hint">Toca una por cada una que tomaras</div>
  </div>
</div>

<div class="caja">
  <h3>🎬 El destello — toca las casillas</h3>
  <div class="claim-row-v2">
    <div class="ci-head"><div class="ci-name">Cañas</div><div class="ci-mine" id="cnt"></div><div class="ci-price">2,50 €/ud</div></div>
    <div class="ci-units" id="vivo"></div>
  </div>
</div>

<script>
const vivo=document.getElementById('vivo'), cnt=document.getElementById('cnt');
let n=0;
for(let i=0;i<6;i++){
  const b=document.createElement('button');
  b.className='unit-pill'; b.innerHTML='<span class="up-body"></span>';
  b.onclick=()=>{
    const era=b.classList.contains('mine');
    b.classList.toggle('mine');
    b.querySelector('.up-body').innerHTML = era ? '' :
      '<svg class="up-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>';
    if(!era){
      const f=document.createElement('span');
      f.className='up-price'; f.textContent='2,50 €';
      b.appendChild(f);
      f.addEventListener('animationend',()=>f.remove());
    }
    n += era ? -1 : 1;
    cnt.textContent = n ? ('tú: '+n+' · '+(n*2.5).toFixed(2).replace('.',',')+' €') : '';
    cnt.classList.toggle('on', n>0);
  };
  vivo.appendChild(b);
}
</script>
</body></html>
