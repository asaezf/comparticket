<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ECEAE4">
  <title>Marca lo tuyo · comparTICKET</title>
  <meta name="description" content="Toca las unidades que has tomado y la app calcula lo que te toca pagar.">

  <!-- Icono. SVG para navegadores modernos; el de 16-32 px va sin renglones
       porque a ese tamaño se convierten en una mancha gris. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">

  <!-- Vista previa al compartir el enlace. La de la pantalla de reparto se
       genera al vuelo en el servidor con el nombre del sitio y el importe. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="comparTICKET">
  <meta property="og:title" content="Marca lo tuyo · comparTICKET">
  <meta property="og:description" content="Toca las unidades que has tomado y la app calcula lo que te toca pagar.">
  <meta property="og:image" content="/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Fuentes con preconexión. Antes se cargaban con @import dentro del CSS,
       que es el método más lento: el navegador tenía que descargar y leer la
       hoja de estilos antes de descubrir siquiera que hacían falta. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900;1,9..40,400&family=Space+Mono:wght@400;700&family=Bricolage+Grotesque:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">

    <div class="top-bar">
      <div style="width:36px;"></div>
      <div class="top-bar-title" id="barTitle"></div>
      <!-- Indicador de conexión en vivo -->
      <div style="width:36px;display:flex;justify-content:center;">
        <span class="live-dot saved" id="liveDot"></span>
      </div>
    </div>

    <!-- Printer Assembly -->
    <div class="printer-assembly">
      <div class="printer-body">
        <div class="printer-brand"><span>compar</span><strong>TICKET</strong></div>
        <div class="printer-right">
          <div class="printer-leds">
            <div class="printer-led on"></div>
            <div class="printer-led idle"></div>
          </div>
        </div>
        <div class="printer-slot-line"></div>
      </div>

      <div class="ticket-wrap">
        <div class="ticket printing" id="ticket">
          <div class="ticket-header">
            <div class="ticket-store" id="ticketStore"></div>
            <div class="ticket-date" id="ticketDate"></div>
          </div>

          <hr class="dash-sep heavy">

          <!-- Name input -->
          <div class="name-field">
            <label id="nameLabel"></label>
            <input type="text" id="nameInput" autocomplete="given-name" maxlength="30">
          </div>

          <!-- Barra informativa: se ha recuperado una selección guardada en
               este móvil. No bloquea; solo deja claro a nombre de quién se
               está marcando, por si el móvil ha cambiado de manos. -->
          <div class="identity-bar hidden" id="identityBar">
            <span class="ib-text" id="identityBarText"></span>
            <button type="button" class="ib-btn" id="identityBarBtn"></button>
          </div>

          <!-- Aviso cuando el nombre escrito ya tiene una selección guardada.
               Sin esto, en un móvil que se pasa de mano en mano la segunda
               persona heredaba en silencio la identidad y las marcas de la
               primera, y al confirmar las sobrescribía. -->
          <div class="name-taken hidden" id="nameTaken">
            <div class="nt-text" id="nameTakenText"></div>
            <div class="nt-actions">
              <button type="button" class="btn btn-outline" id="nameTakenMine"></button>
              <button type="button" class="btn btn-outline" id="nameTakenOther"></button>
            </div>
          </div>

          <hr class="dash-sep">

          <!-- Ayuda plegable: la explicación sigue disponible para quien la
               busque, pero no ocupa la pantalla de quien ya sabe. El paso a
               paso lo da la etiqueta flotante de la primera vez. -->
          <details class="claim-help" id="claimHelp">
            <summary id="helpSummary"></summary>
            <div class="ct-step"><div class="ct-num">1</div><div class="ct-txt" id="ctut1"></div></div>
            <div class="ct-step"><div class="ct-num">2</div><div class="ct-txt" id="ctut2"></div></div>
            <div class="ct-step"><div class="ct-num">3</div><div class="ct-txt" id="ctut3"></div></div>
          </details>

          <hr class="dash-sep">

          <!-- Quién más está en el ticket ahora mismo -->
          <div class="live-people hidden" id="livePeople"></div>

          <!-- Items checkboxes -->
          <div id="itemsList"></div>

          <hr class="dash-sep heavy">

          <div class="data-row">
            <span class="data-label" id="lblTotal"></span>
            <span class="data-value big" id="yourTotal">€0,00</span>
          </div>
        </div>
        <div class="ticket-zigzag"></div>
      </div>
    </div>

    <div class="bottom-sticky">
      <button class="btn btn-dark btn-full" id="confirmBtn" disabled></button>
    </div>

    <div class="home-indicator"></div>
    <div class="easter-egg">desarrollado por A.Sáez.F</div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/money.js"></script>
  <script src="/js/claim.js"></script>
</body>
</html>
