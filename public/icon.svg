<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="comparTICKET">
  <!--
    Icono de la aplicación, diseñado por Álvaro. Se instala tal cual viene:
    dos tickets superpuestos —el blanco delante, el negro detrás— con las
    muescas laterales y el borde dentado, sobre el naranja de la marca.

    Va sin esquinas redondeadas a propósito: el fondo llega hasta el borde y
    es cada sistema el que recorta la forma que le toque (círculo en Android,
    cuadrado redondeado en iOS). Redondearlo aquí dejaría un halo del color
    del escritorio en las esquinas.

    El dibujo cabe dentro del círculo de seguridad que exige un icono
    "maskable" (el 80% central), así que ningún recorte se come parte de los
    tickets. Por eso el manifest lo declara "any maskable".

    Los PNG de 192, 512 y 180 px que hay al lado salen de este mismo diseño:
    Chrome usa los PNG para el diálogo de instalación.
  -->
  <rect width="512" height="512" fill="#FF6B35"></rect>
  <path fill="#18181B" d="M196 128 h184 v276 l-11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 z"></path>
  <circle cx="380" cy="262" r="22" fill="#FF6B35"></circle>
  <path fill="#FEFEF8" d="M132 96 h184 v276 l-11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 -11.5 12 -11.5 -12 z"></path>
  <circle cx="132" cy="230" r="22" fill="#FF6B35"></circle>
  <circle cx="316" cy="230" r="22" fill="#18181B"></circle>
  <rect x="156" y="138" width="112" height="16" rx="8" fill="#18181B"></rect>
  <rect x="156" y="286" width="88" height="14" rx="7" fill="#D4D4D8"></rect>
  <rect x="156" y="318" width="124" height="14" rx="7" fill="#D4D4D8"></rect>
</svg>
