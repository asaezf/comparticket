<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="comparTICKET">
  <!--
    Icono de la aplicación, diseñado por Álvaro (versión "código de barras").
    Se instala tal cual viene: un ticket a sangre con sus muescas laterales,
    el borde inferior dentado y el código de barras abajo, sobre el naranja
    de la marca.

    Va sin esquinas redondeadas a propósito: el fondo llega hasta el borde y
    es cada sistema el que recorta la forma que le toque (círculo en Android,
    squircle en iOS). Redondearlo aquí dejaría un halo del color del
    escritorio en las esquinas.

    El dibujo cae dentro del círculo de seguridad, así que aguanta cualquier
    recorte sin comerse nada: por eso el manifest lo declara "maskable".

    Los PNG de 192, 512 y 180 px que hay al lado salen de este mismo diseño.
    Chrome usa los PNG para el diálogo de instalación, y Safari NO admite SVG
    en apple-touch-icon — con SVG se queda con una captura de la página.
  -->
  <rect width="512" height="512" fill="#FF6B35"></rect>
  <path fill="#FEFEF8" d="M96 -24 h320 v462 l-16 14 -16 -14 -16 14 -16 -14 -16 14 -16 -14 -16 14 -16 -14 -16 14 -16 -14 -16 14 -16 -14 -16 14 -16 -14 -16 14 -16 -14 -16 14 -16 -14 -16 14 -16 -14 z"></path>
  <circle cx="96" cy="252" r="36" fill="#FF6B35"></circle>
  <circle cx="416" cy="252" r="36" fill="#FF6B35"></circle>
  <rect x="140" y="60" width="232" height="28" rx="14" fill="#18181B"></rect>
  <rect x="140" y="120" width="156" height="20" rx="10" fill="#D4D4D8"></rect>
  <rect x="140" y="164" width="196" height="20" rx="10" fill="#D4D4D8"></rect>
  <g fill="#18181B"><rect x="140" y="330" width="22" height="66"></rect><rect x="174" y="330" width="10" height="66"></rect><rect x="196" y="330" width="28" height="66"></rect><rect x="236" y="330" width="10" height="66"></rect><rect x="258" y="330" width="22" height="66"></rect><rect x="292" y="330" width="10" height="66"></rect><rect x="314" y="330" width="28" height="66"></rect><rect x="354" y="330" width="18" height="66"></rect></g>
</svg>
