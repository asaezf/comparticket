<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="comparTICKET">
  <!--
    Icono de la aplicación, diseñado por Álvaro (versión "código de barras",
    con más margen alrededor del ticket que la anterior). Se instala tal cual
    viene: un ticket a sangre con sus muescas laterales, el borde inferior
    dentado y el código de barras abajo, sobre el naranja de la marca.

    Va sin esquinas redondeadas a propósito: el fondo llega hasta el borde y
    es cada sistema el que recorta la forma que le toque (círculo en Android,
    squircle en iOS). Redondearlo aquí dejaría un halo del color del
    escritorio en las esquinas.

    El dibujo cae dentro del círculo de seguridad, así que aguanta cualquier
    recorte sin comerse nada: por eso el manifest lo declara "maskable".

    Los PNG de 192, 512 y 180 px que hay al lado salen de este mismo diseño.
    Chrome usa los PNG para el diálogo de instalación, y Safari NO admite SVG
    en apple-touch-icon — con SVG se queda con una captura de la página.
  -->
  <rect width="512" height="512" fill="#FF6B35"></rect>
  <path fill="#FEFEF8" d="M130 -24 h252 v424 l-9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 -9 12 -9 -12 z"></path>
  <circle cx="130" cy="240" r="30" fill="#FF6B35"></circle>
  <circle cx="382" cy="240" r="30" fill="#FF6B35"></circle>
  <rect x="168" y="60" width="176" height="26" rx="13" fill="#18181B"></rect>
  <rect x="168" y="118" width="118" height="18" rx="9" fill="#D4D4D8"></rect>
  <rect x="168" y="158" width="150" height="18" rx="9" fill="#D4D4D8"></rect>
  <g fill="#18181B"><rect x="168" y="300" width="18" height="58"></rect><rect x="194" y="300" width="8" height="58"></rect><rect x="210" y="300" width="22" height="58"></rect><rect x="240" y="300" width="8" height="58"></rect><rect x="256" y="300" width="18" height="58"></rect><rect x="282" y="300" width="8" height="58"></rect><rect x="298" y="300" width="22" height="58"></rect><rect x="328" y="300" width="16" height="58"></rect></g>
</svg>
