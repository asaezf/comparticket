# Las pruebas se ejecutan solas en cada push y en cada pull request.
#
# Por qué hace falta: este repositorio lo tocan dos sesiones distintas que
# empujan a main por separado, y hasta ahora las 673 pruebas solo se ejecutaban
# si a alguien se le ocurría lanzarlas a mano. Con esto, romper el cuadre de un
# grupo o la lectura de un ticket se ve en el propio push, no cuando alguien lo
# sufre en un viaje.
#
# No hace falta ni base de datos ni clave de IA: todas las pruebas del runner
# son de lógica pura y de ficheros del repositorio.
name: pruebas

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
